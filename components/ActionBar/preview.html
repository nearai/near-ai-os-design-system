<!-- @dsCard group="Actions" height=250 subtitle="Notes above a bar of CTA-sized buttons; shared row on a phone" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ActionBar — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 412px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">Ready to contribute</div>
    <div class="nr-card nr-stack">
      <div class="web-body-strong">near-agents · today at 10:42</div>
      <div class="web-caption nr-text-secondary">14 steps · 6 tool calls · Private AI</div>
    </div>
    <div class="nr-action-bar">
      <div class="nr-action-bar__notes">
        <p class="nr-action-bar__note web-label">Contribute sends these 14 steps to Trace Commons.</p>
        <p class="nr-action-bar__note web-label">Nothing is sent unless you say so.</p>
      </div>
      <div class="nr-action-bar__row">
        <button class="nr-button nr-button--glass web-body-strong">Back</button>
        <div class="nr-action-bar__end">
          <button class="nr-button nr-button--glass web-body-strong">Dismiss</button>
          <button class="nr-button nr-button--primary web-body-strong">Contribute</button>
        </div>
      </div>
    </div>
  </section>
  <section class="nr-pane nr-pane--opaque nr-touch nr-stack" style="width: 304px">
    <div class="ios-body-strong">Automatic for near-agents</div>
    <div class="ios-caption nr-text-secondary">Ask me · 3 sessions waiting</div>
    <div class="nr-action-bar nr-action-bar--stretch">
      <div class="nr-action-bar__notes">
        <p class="nr-action-bar__note ios-caption">Automatic sends each finished session without asking first.</p>
      </div>
      <div class="nr-action-bar__row">
        <div class="nr-action-bar__end">
          <button class="nr-button nr-button--glass ios-body-strong">Cancel</button>
          <button class="nr-button nr-button--primary ios-body-strong">Turn on</button>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
