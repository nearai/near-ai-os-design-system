<!-- @dsCard group="Feedback" height=200 subtitle="Decisions owed: a count, 99+ at the cap, a dash when unknown" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 340px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">Tab titles</div>
    <div class="nr-card nr-stack">
      <div class="nr-spread"><span class="nr-row"><span class="web-body-strong">Traces</span><span class="nr-badge web-micro" aria-label="3 decisions waiting">3</span></span><span class="web-caption nr-text-tertiary">3 owed</span></div>
      <hr class="nr-hairline">
      <div class="nr-spread"><span class="nr-row"><span class="web-body-strong">Traces</span><span class="nr-badge web-micro" aria-label="More than 99 decisions waiting">99+</span></span><span class="web-caption nr-text-tertiary">142 owed, capped</span></div>
      <hr class="nr-hairline">
      <div class="nr-spread"><span class="nr-row"><span class="web-body-strong">Traces</span><span class="nr-badge web-micro" aria-label="Decisions waiting: unavailable">—</span></span><span class="web-caption nr-text-tertiary">count unavailable</span></div>
    </div>
  </section>
  <section class="nr-pane nr-stack" style="width: 340px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">Subtle and anchored</div>
    <div class="nr-card nr-stack">
      <div class="nr-row">
        <span class="nr-row web-label nr-text-secondary">Waiting <span class="nr-badge nr-badge--subtle web-micro" aria-label="12 decisions waiting">12</span></span>
        <span class="nr-row web-label nr-text-secondary">Held <span class="nr-badge nr-badge--subtle web-micro" aria-label="Held for review: unavailable">—</span></span>
      </div>
      <hr class="nr-hairline">
      <div class="nr-row">
        <span style="width: 34px"><span class="nr-badge__host nr-text-secondary" role="img" aria-label="Menu bar, 2 decisions waiting">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5 5.5 5h11l2.5 7.5v4.5H3z"/><path d="M3 12.5h5l1 2h4l1-2h5"/></svg>
          <span class="nr-badge nr-badge--anchored web-micro" aria-hidden="true">2</span>
        </span></span>
        <span class="web-caption nr-text-tertiary">Over a glyph: top trailing corner</span>
      </div>
    </div>
  </section>
</div>
</body>
</html>
