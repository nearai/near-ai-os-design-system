<!-- @dsCard group="Actions" height=222 subtitle="Kinds, the Refresh pill, states and the size ladder" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 100%">
    <div class="nr-row">
      <button class="nr-button nr-button--primary web-body-strong">Submit</button>
      <button class="nr-button nr-button--glass web-label">Look inside</button>
      <button class="nr-button nr-button--destructive web-label">Withdraw</button>
      <button class="nr-button nr-button--glass web-label">Download</button>
      <button class="nr-button nr-button--refresh web-label" aria-label="Refresh your tools">Refresh<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.46-3.54M13 3v3h-3"/></svg></button>
      <button class="nr-button nr-button--link web-label">Not this one</button>
    </div>
    <div class="nr-row">
      <button class="nr-button nr-button--primary web-body-strong" disabled>Submit</button>
      <button class="nr-button nr-button--primary web-body-strong" aria-busy="true"><span class="nr-button__spinner" aria-hidden="true"></span>Sending…</button>
      <button class="nr-button nr-button--glass web-label" aria-pressed="true">Private AI</button>
      <button class="nr-button nr-button--glass web-label" aria-pressed="false">Outside model</button>
      <button class="nr-button nr-button--submit web-caption">Submit 3</button>
      <button class="nr-button nr-button--submit web-caption" data-done>Sent</button>
    </div>
    <hr class="nr-hairline">
    <table>
      <tr>
        <td style="width: 104px"><button class="nr-button nr-button--submit web-caption">Submit 3</button></td>
        <td style="width: 112px"><button class="nr-button nr-button--glass web-label">Look inside</button></td>
        <td style="width: 112px"><button class="nr-button nr-button--glass nr-button--small web-label">Cancel</button></td>
        <td style="width: 120px"><button class="nr-button nr-button--glass nr-button--bar web-body-strong">Back</button></td>
        <td class="nr-touch" style="width: 140px"><button class="nr-button nr-button--primary ios-body-strong">Submit</button></td>
      </tr>
      <tr class="web-caption nr-text-tertiary">
        <td>Submit 24</td><td>Inline 28</td><td>Small 30</td><td>Bar 34</td><td>Touch 44</td>
      </tr>
    </table>
  </section>
</div>
</body>
</html>
