<!-- @dsCard group="Inputs" height=272 subtitle="On, off and mixed; consent rows and a parent over its children" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 344px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">How traces may be used</div>
    <label class="nr-checkbox web-label">
      <input class="nr-checkbox__box" type="checkbox" checked disabled>
      <span class="nr-checkbox__text"><span class="nr-checkbox__title">Store submitted traces on the server that receives them.</span><span class="nr-checkbox__sub web-caption">Required to submit.</span></span>
    </label>
    <label class="nr-checkbox web-label">
      <input class="nr-checkbox__box" type="checkbox" checked>
      <span class="nr-checkbox__text">Researchers may use contributed traces to evaluate coding agents.</span>
    </label>
    <label class="nr-checkbox web-label">
      <input class="nr-checkbox__box" type="checkbox">
      <span class="nr-checkbox__text">Contributed traces may appear in a public benchmark.</span>
    </label>
  </section>
  <section class="nr-pane nr-stack" style="width: 344px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">Past traces</div>
    <label class="nr-checkbox web-label">
      <input class="nr-checkbox__box" type="checkbox" data-mixed aria-controls="cb-a cb-b">
      <span class="nr-checkbox__text">Offer past traces from every folder</span>
    </label>
    <label class="nr-checkbox nr-checkbox--child web-label">
      <input class="nr-checkbox__box" type="checkbox" id="cb-a" checked>
      <span class="nr-checkbox__text"><span class="nr-checkbox__title">near-agents</span><span class="nr-checkbox__sub web-caption">12 traces</span></span>
    </label>
    <label class="nr-checkbox nr-checkbox--child web-label">
      <input class="nr-checkbox__box" type="checkbox" id="cb-b">
      <span class="nr-checkbox__text"><span class="nr-checkbox__title">nearcore</span><span class="nr-checkbox__sub web-caption">4 traces</span></span>
    </label>
    <div class="nr-hairline"></div>
    <div class="web-caption nr-text-tertiary">Touch (Android)</div>
    <div class="nr-touch">
      <label class="nr-checkbox android-body">
        <input class="nr-checkbox__box" type="checkbox" checked>
        <span class="nr-checkbox__text">Notify me when a trace waits</span>
      </label>
    </div>
  </section>
</div>
<script>document.querySelectorAll('[data-mixed]').forEach(function (b) { b.indeterminate = true; });</script>
</body>
</html>
