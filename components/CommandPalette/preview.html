<!-- @dsCard group="Actions" height=408 subtitle="Mod+K palette with a typed query, groups and an Ask row" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandPalette — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <div class="nr-command-palette" role="dialog" aria-label="Commands">
    <div class="nr-command-palette__search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.25 10.25L13.5 13.5"/></svg>
      <input class="nr-command-palette__input web-title" type="text" value="watch" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-activedescendant="cmd-pause" aria-label="Search commands" placeholder="Type a command or ask Near AI">
    </div>
    <div class="nr-command-palette__list" id="palette-list" role="listbox" aria-label="Commands">
      <p class="nr-command-palette__heading web-eyebrow nr-upper" role="presentation">Commands</p>
      <div class="nr-command-palette__item web-body" role="option" id="cmd-pause" aria-selected="true">
        <span class="nr-command-palette__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg></span>
        <span class="nr-command-palette__title">Pause <span class="nr-command-palette__match">watch</span>ing</span>
        <span class="nr-command-palette__keys web-caption" aria-hidden="true"><kbd class="nr-command-palette__key">Ctrl</kbd><kbd class="nr-command-palette__key">Shift</kbd><kbd class="nr-command-palette__key">.</kbd></span>
      </div>
      <div class="nr-command-palette__item web-body" role="option" aria-selected="false">
        <span class="nr-command-palette__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/></svg></span>
        <span class="nr-command-palette__title">Show <span class="nr-command-palette__match">watch</span>ed folders</span>
        <span class="nr-command-palette__keys web-caption" aria-hidden="true"><kbd class="nr-command-palette__key">Ctrl</kbd><kbd class="nr-command-palette__key">1</kbd></span>
      </div>
      <p class="nr-command-palette__heading web-eyebrow nr-upper" role="presentation">Folders</p>
      <div class="nr-command-palette__item web-body" role="option" aria-selected="false">
        <span class="nr-command-palette__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/></svg></span>
        <span class="nr-command-palette__title">near-agents <span class="nr-command-palette__context web-caption">· <span class="nr-command-palette__match">Watch</span>ing · Ask</span></span>
      </div>
      <div class="nr-command-palette__item web-body" role="option" aria-selected="false">
        <span class="nr-command-palette__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/></svg></span>
        <span class="nr-command-palette__title">trace-commons <span class="nr-command-palette__context web-caption">· Paused</span></span>
      </div>
      <p class="nr-command-palette__heading web-eyebrow nr-upper" role="presentation">Ask</p>
      <div class="nr-command-palette__item web-body" role="option" aria-selected="false">
        <span class="nr-command-palette__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7.5l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/></svg></span>
        <span class="nr-command-palette__title">Ask Near AI about “watch”</span>
        <span class="nr-command-palette__keys web-caption" aria-hidden="true"><kbd class="nr-command-palette__key">Tab</kbd></span>
      </div>
    </div>
    <div class="nr-command-palette__footer web-caption" aria-hidden="true">
      <span><kbd class="nr-command-palette__key">↑</kbd> <kbd class="nr-command-palette__key">↓</kbd> Move</span>
      <span><kbd class="nr-command-palette__key">Enter</kbd> Run</span>
      <span><kbd class="nr-command-palette__key">Esc</kbd> Close</span>
    </div>
  </div>
</div>
</body>
</html>
