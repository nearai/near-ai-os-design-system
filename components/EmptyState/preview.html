<!-- @dsCard group="Feedback" height=292 subtitle="Blank, filtered and idle: the product's sentence, one action at most" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>EmptyState — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane" style="width: 352px">
    <div class="nr-empty-state">
      <svg class="nr-empty-state__glyph" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5 5.5 5h11l2.5 7.5v4.5H3z"/><path d="M3 12.5h5l1 2h4l1-2h5"/></svg>
      <h3 class="nr-empty-state__title web-body-strong">Nothing is waiting.</h3>
      <p class="nr-empty-state__detail web-caption">When a trace finishes and goes quiet, it shows up here. Nothing is sent unless you say so.</p>
    </div>
  </section>
  <section class="nr-pane nr-stack" style="width: 352px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">History · Failed</div>
    <div class="nr-card">
      <div class="nr-empty-state nr-empty-state--inline">
        <h3 class="nr-empty-state__title web-body-strong">No sessions match “Failed”.</h3>
        <p class="nr-empty-state__detail web-caption">12 sessions are hidden by this filter.</p>
        <div class="nr-empty-state__actions"><button class="nr-button nr-button--link web-label">Clear filter</button></div>
      </div>
    </div>
    <div class="web-eyebrow nr-upper nr-text-tertiary">Inspector</div>
    <div class="nr-card nr-card--quiet">
      <div class="nr-empty-state nr-empty-state--inline">
        <p class="nr-empty-state__detail web-caption">Select a session to see what it would send.</p>
      </div>
    </div>
  </section>
</div>
</body>
</html>
