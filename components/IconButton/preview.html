<!-- @dsCard group="Actions" height=176 subtitle="Round, pill, toolbar group, kebab and bare glyphs" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 100%">
    <table>
      <tr>
        <td style="width: 64px"><button class="nr-icon-button" aria-label="Add folder"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button></td>
        <td style="width: 64px"><button class="nr-icon-button nr-icon-button--small" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></td>
        <td style="width: 64px"><button class="nr-icon-button" aria-pressed="true" aria-label="Watch near-agents"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg></button></td>
        <td style="width: 88px"><div class="nr-row"><button class="nr-icon-button nr-icon-button--pill" aria-label="Previous week"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5L5.5 8 10 12.5"/></svg></button><button class="nr-icon-button nr-icon-button--pill" aria-label="Next week"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button></div></td>
        <td style="width: 148px">
          <div class="nr-icon-button-group" role="toolbar" aria-label="View">
            <button class="nr-icon-button nr-icon-button--toolbar" aria-pressed="true" aria-label="Show sidebar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2.5"/><path d="M6.5 3v10"/></svg></button>
            <button class="nr-icon-button nr-icon-button--toolbar" aria-pressed="false" aria-label="Show graph"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 13V8.5M8 13V3.5M12.5 13V6.5"/></svg></button>
            <button class="nr-icon-button nr-icon-button--toolbar" aria-haspopup="menu" aria-expanded="true" aria-label="View options"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 5h10M3 11h10"/><circle cx="6" cy="5" r="1.6" fill="currentColor"/><circle cx="10" cy="11" r="1.6" fill="currentColor"/></svg></button>
            <button class="nr-icon-button nr-icon-button--toolbar" aria-pressed="true" aria-label="Show inspector"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2.5"/><path d="M9.5 3v10"/></svg></button>
          </div>
        </td>
        <td style="width: 72px"><div class="nr-row"><button class="nr-icon-button nr-icon-button--kebab" aria-haspopup="menu" aria-label="More for near-agents"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3.5" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="12.5" r="1.3"/></svg></button><button class="nr-icon-button nr-icon-button--kebab" aria-haspopup="menu" aria-expanded="true" aria-label="More for trace-commons"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3.5" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="12.5" r="1.3"/></svg></button></div></td>
        <td style="width: 56px"><button class="nr-icon-button nr-icon-button--bare" aria-label="Refresh balance"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.46-3.54M13 3v3h-3"/></svg></button></td>
        <td style="width: 56px"><button class="nr-icon-button" disabled aria-label="Add folder"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button></td>
      </tr>
      <tr class="web-caption nr-text-tertiary">
        <td>Round</td><td>Small</td><td>Toggle on</td><td>Pill</td><td>Toolbar group</td><td>Kebab</td><td>Bare</td><td>Disabled</td>
      </tr>
    </table>
    <hr class="nr-hairline">
    <div class="nr-row nr-touch">
      <button class="nr-icon-button" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      <button class="nr-icon-button" aria-label="Send"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3.5M4 7.5l4-4 4 4"/></svg></button>
      <button class="nr-icon-button nr-icon-button--kebab" aria-label="More for this chat"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3.5" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="12.5" r="1.3"/></svg></button>
      <span class="web-caption nr-text-tertiary">Touch: 44 visible, 48 hit area</span>
    </div>
  </section>
</div>
</body>
</html>
