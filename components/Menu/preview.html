<!-- @dsCard group="Actions" height=350 subtitle="A row menu with choices, a submenu and a destructive item; panel rows" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Menu — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 380px">
    <div class="nr-card nr-card--quiet nr-spread">
      <div class="nr-stack"><div class="web-body-strong">near-agents</div><div class="web-caption nr-text-secondary">Ask · 3 traces waiting</div></div>
      <div class="nr-menu-anchor">
        <button class="nr-icon-button nr-icon-button--kebab" aria-haspopup="menu" aria-expanded="true" aria-controls="folder-menu" aria-label="More for near-agents"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3.5" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="12.5" r="1.3"/></svg></button>

        <div class="nr-menu" id="folder-menu" role="menu" aria-label="More for near-agents" style="width: 260px">
          <p class="nr-menu__heading web-eyebrow nr-upper" role="presentation">When a trace finishes</p>
          <button class="nr-menu__item web-body" role="menuitemradio" aria-checked="true"><span class="nr-menu__check"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span><span class="nr-menu__label">Ask</span></button>
          <button class="nr-menu__item web-body" role="menuitemradio" aria-checked="false" data-highlighted><span class="nr-menu__check"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span><span class="nr-menu__label">Automatic</span></button>
          <button class="nr-menu__item web-body" role="menuitemradio" aria-checked="false"><span class="nr-menu__check"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span><span class="nr-menu__label">Never</span></button>
          <hr class="nr-menu__separator">
          <button class="nr-menu__item web-body" role="menuitem"><span class="nr-menu__check"></span><span class="nr-menu__label">Copy path</span><span class="nr-menu__trailing">Ctrl+Shift+C</span></button>
          <button class="nr-menu__item web-body" role="menuitem" aria-haspopup="menu"><span class="nr-menu__check"></span><span class="nr-menu__label">Sort traces by</span><span class="nr-menu__trailing"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span></button>
          <button class="nr-menu__item web-body" role="menuitem" aria-disabled="true"><span class="nr-menu__check"></span><span class="nr-menu__label">Submit all</span></button>
          <hr class="nr-menu__separator">
          <button class="nr-menu__item nr-menu__item--destructive web-body" role="menuitem"><span class="nr-menu__check"></span><span class="nr-menu__label">Withdraw contributions…</span></button>
        </div>
      </div>
    </div>
  </section>
  <section class="nr-pane nr-compact nr-stack" style="width: 300px">
    <div class="mac-eyebrow nr-upper nr-text-tertiary">Near.ai</div>
    <div class="nr-menu nr-menu--inline" role="menu" aria-label="Near.ai">
      <button class="nr-menu__item mac-body" role="menuitem"><span class="nr-menu__label">Open Monitor</span></button>
      <button class="nr-menu__item mac-body" role="menuitem" data-highlighted><span class="nr-menu__label">Pause watching for 1 hour</span></button>
      <button class="nr-menu__item mac-body" role="menuitem"><span class="nr-menu__label">Settings…</span><span class="nr-menu__trailing">⌘,</span></button>
      <hr class="nr-menu__separator">
      <button class="nr-menu__item mac-body" role="menuitem"><span class="nr-menu__label">Quit Near.ai</span><span class="nr-menu__trailing">⌘Q</span></button>
    </div>
  </section>
</div>
</body>
</html>
