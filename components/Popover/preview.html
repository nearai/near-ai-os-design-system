<!-- @dsCard group="Presentation" height=178 subtitle="A pinned info popover and a node card with one action" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <div class="nr-popover" role="dialog" aria-labelledby="p2-title" style="width: 260px">
    <div class="nr-popover__title web-body-strong" id="p2-title">Step 6 · web search</div>
    <p class="nr-popover__text web-caption">8 results in 1.2 s. The query and its results are part of this trace.</p>
    <div class="nr-popover__actions">
      <button class="nr-button nr-button--glass web-label">Look inside</button>
    </div>
  </div>
  <section class="nr-pane nr-stack" style="width: 340px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">What this trace holds</div>
    <div class="nr-card nr-card--quiet nr-spread">
      <span class="web-body">Gateway text
        <span class="nr-popover-anchor nr-popover-anchor--start">
          <button class="nr-popover__info" aria-expanded="true" aria-controls="info-1" aria-label="More about trace text"><svg viewBox="0 0 16 16" aria-hidden="true"><circle class="nr-popover__info-disc" cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path class="nr-popover__info-mark" d="M8 7.25v4M8 4.75v.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <span class="nr-popover nr-popover--fixed" id="info-1" role="dialog" aria-label="Gateway text"><span class="nr-popover__text web-caption">Every prompt and reply in the trace, as the model received them. Tool output is included for steps that used a tool.</span></span>
        </span>
      </span>
      <span class="web-label nr-text-secondary">Included</span>
    </div>
    <div class="nr-card nr-card--quiet nr-spread">
      <span class="web-body">File names
        <span class="nr-popover-anchor"><button class="nr-popover__info" aria-expanded="false" aria-label="More about file names"><svg viewBox="0 0 16 16" aria-hidden="true"><circle class="nr-popover__info-disc" cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path class="nr-popover__info-mark" d="M8 7.25v4M8 4.75v.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></span>
      </span>
      <span class="web-label nr-text-secondary">Not included</span>
    </div>
  </section>
</div>
</body>
</html>
