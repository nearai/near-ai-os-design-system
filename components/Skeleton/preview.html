<!-- @dsCard group="Feedback" height=236 subtitle="Placeholders for lists of known shape; values load as a dash" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Skeleton — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 352px">
    <div class="nr-spread"><span class="web-eyebrow nr-upper nr-text-tertiary">Submissions</span><span class="nr-spinner-status web-caption"><span class="nr-spinner" aria-hidden="true"></span><span role="status">Reading history…</span></span></div>
    <div class="nr-card nr-skeleton-group" aria-hidden="true">
      <div class="nr-row"><span class="nr-skeleton nr-skeleton--tile"></span><div class="nr-skeleton-group" style="width: 240px"><span class="nr-skeleton" style="width: 90%"></span><span class="nr-skeleton" style="width: 65%"></span></div></div>
      <hr class="nr-hairline">
      <div class="nr-row"><span class="nr-skeleton nr-skeleton--tile"></span><div class="nr-skeleton-group" style="width: 240px"><span class="nr-skeleton" style="width: 80%"></span><span class="nr-skeleton" style="width: 55%"></span></div></div>
      <hr class="nr-hairline">
      <div class="nr-row"><span class="nr-skeleton nr-skeleton--tile"></span><div class="nr-skeleton-group" style="width: 240px"><span class="nr-skeleton" style="width: 85%"></span><span class="nr-skeleton" style="width: 60%"></span></div></div>
    </div>
  </section>
  <section class="nr-pane nr-stack" style="width: 352px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">This week</div>
    <div class="nr-row">
      <div class="nr-card nr-stack" style="width: 92px"><span class="web-eyebrow nr-upper nr-text-tertiary">Waiting</span><span class="web-heading nr-tabular" aria-label="Waiting: unavailable">—</span></div>
      <div class="nr-card nr-stack" style="width: 92px"><span class="web-eyebrow nr-upper nr-text-tertiary">Shared</span><span class="web-heading nr-tabular" aria-label="Shared: unavailable">—</span></div>
      <div class="nr-card nr-stack" style="width: 92px"><span class="web-eyebrow nr-upper nr-text-tertiary">Kept</span><span class="web-heading nr-tabular">14</span></div>
    </div>
    <span class="web-caption nr-text-secondary">A value still loading is a dash, never a bar and never zero.</span>
  </section>
</div>
</body>
</html>
