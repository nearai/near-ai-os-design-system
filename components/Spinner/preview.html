<!-- @dsCard group="Feedback" height=190 subtitle="Work with no measure: a quarter arc beside specific words" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Spinner — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 352px">
    <div class="nr-card nr-stack">
      <span class="nr-spinner-status web-caption"><span class="nr-spinner" aria-hidden="true"></span><span role="status">Reading local queue…</span></span>
      <hr class="nr-hairline">
      <div class="nr-spread"><span class="web-body">Connection</span><span class="nr-spinner" role="progressbar" aria-label="Checking the connection"></span></div>
      <hr class="nr-hairline">
      <div class="nr-row">
        <span class="nr-spinner" aria-hidden="true"></span><span class="web-caption nr-text-tertiary">12 inline</span>
        <span class="nr-spinner nr-spinner--medium" aria-hidden="true"></span><span class="web-caption nr-text-tertiary">16 touch</span>
        <span class="nr-spinner nr-spinner--large" aria-hidden="true"></span><span class="web-caption nr-text-tertiary">32 pane</span>
      </div>
    </div>
  </section>
  <section class="nr-pane" style="width: 352px">
    <div class="nr-card nr-spinner-status nr-spinner-status--center">
      <span class="nr-spinner nr-spinner--large" aria-hidden="true"></span>
      <span class="web-label" role="status">Checking proofs for 12 calls…</span>
      <span class="web-caption nr-text-tertiary">You can keep using the list while this runs.</span>
    </div>
  </section>
</div>
</body>
</html>
