<!-- @dsCard group="Data" height=262 subtitle="Stat cards with an unknown value; legend cells for model calls and Shared/Kept" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatCard — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 728px" aria-label="Overview">
    <div class="nr-stat-card-row">
      <div class="nr-stat-card"><div class="nr-stat-card__label web-eyebrow">Waiting</div><div class="nr-stat-card__value web-heading">14</div></div>
      <div class="nr-stat-card"><div class="nr-stat-card__label web-eyebrow">Contributed</div><div class="nr-stat-card__value web-heading">1,279</div></div>
      <div class="nr-stat-card"><div class="nr-stat-card__label web-eyebrow">Credit pending</div><div class="nr-stat-card__value web-heading" aria-label="Unknown">—</div><div class="nr-stat-card__note web-caption">Shown once the commons accepts.</div></div>
      <div class="nr-stat-card"><div class="nr-stat-card__label web-eyebrow">Spent this month</div><div class="nr-stat-card__value web-heading">4.21 NEAR</div></div>
    </div>
    <div class="web-eyebrow nr-upper nr-text-tertiary">Private AI ledger</div>
    <div class="nr-stat-card-row nr-stat-card-row--legend">
      <div class="nr-stat-card nr-stat-card--legend"><span class="nr-stat-card__dot nr-stat-card__dot--data-1" aria-hidden="true"></span><span class="nr-stat-card__label web-body">Calls</span><span class="nr-stat-card__value web-body-strong">1,284</span></div>
      <div class="nr-stat-card nr-stat-card--legend"><span class="nr-stat-card__dot nr-stat-card__dot--positive" aria-hidden="true"></span><span class="nr-stat-card__label web-body">Verified</span><span class="nr-stat-card__value web-body-strong">1,279</span></div>
      <div class="nr-stat-card nr-stat-card--legend"><span class="nr-stat-card__dot nr-stat-card__dot--data-2" aria-hidden="true"></span><span class="nr-stat-card__label web-body">Priced</span><span class="nr-stat-card__value web-body-strong">1,284</span></div>
    </div>
    <div class="nr-stat-card-row nr-stat-card-row--legend" style="width: 300px">
      <div class="nr-stat-card nr-stat-card--legend"><span class="nr-stat-card__dot nr-stat-card__dot--data-1" aria-hidden="true"></span><span class="nr-stat-card__label web-body">Shared with the commons</span><span class="nr-stat-card__value web-body-strong">—</span></div>
      <div class="nr-stat-card nr-stat-card--legend"><span class="nr-stat-card__dot nr-stat-card__dot--data-2" aria-hidden="true"></span><span class="nr-stat-card__label web-body">Kept</span><span class="nr-stat-card__value web-body-strong">7</span></div>
    </div>
  </section>
</div>
</body>
</html>
