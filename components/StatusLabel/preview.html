<!-- @dsCard group="Feedback" height=276 subtitle="A dot and its words: the only way status is shown" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusLabel — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-stack" style="width: 340px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">This Mac</div>
    <div class="nr-card nr-stack">
      <div class="nr-spread"><span class="web-body">Watcher</span><span class="nr-status-label web-label"><span class="nr-status-label__dot nr-status-label__dot--positive"></span><span class="nr-status-label__text">Watching</span></span></div>
      <hr class="nr-hairline">
      <div class="nr-spread"><span class="web-body">near-agents</span><span class="nr-status-label web-label"><span class="nr-status-label__dot nr-status-label__dot--caution"></span><span class="nr-status-label__text">Ask</span></span></div>
      <hr class="nr-hairline">
      <div class="nr-spread"><span class="web-body">scratch</span><span class="nr-status-label web-label"><span class="nr-status-label__dot nr-status-label__dot--neutral"></span><span class="nr-status-label__text">Paused</span></span></div>
      <hr class="nr-hairline">
      <div class="nr-spread"><span class="web-body">Model route</span><span class="nr-status-label web-label"><span class="nr-status-label__dot nr-status-label__dot--critical"></span><span class="nr-status-label__text">Leaves for an outside model</span></span></div>
      <hr class="nr-hairline">
      <div class="nr-spread"><span class="web-body">Private AI</span><span class="nr-status-label web-label"><span class="nr-status-label__text">Unknown</span></span></div>
    </div>
  </section>
  <section class="nr-pane nr-stack" style="width: 340px">
    <div class="web-eyebrow nr-upper nr-text-tertiary">Lead, strong, legend, dense</div>
    <div class="nr-card">
      <span class="nr-status-label nr-status-label--lead">
        <span class="nr-status-label__dot nr-status-label__dot--positive nr-status-label__dot--ring"></span>
        <span class="nr-status-label__text web-body-strong">Watching</span>
        <span class="nr-status-label__sub web-caption">3 traces waiting for you</span>
      </span>
    </div>
    <div class="nr-card nr-stack">
      <span class="nr-status-label nr-status-label--strong web-label"><span class="nr-status-label__dot nr-status-label__dot--caution"></span><span class="nr-status-label__text">Folder mode needs a look</span></span>
      <div class="nr-row nr-compact"><span class="nr-status-label mac-label"><span class="nr-status-label__dot nr-status-label__dot--positive nr-status-label__dot--halo"></span><span class="nr-status-label__text">Shared</span></span><span class="nr-status-label mac-label"><span class="nr-status-label__dot nr-status-label__dot--neutral nr-status-label__dot--halo"></span><span class="nr-status-label__text">Kept</span></span></div>
      <div class="nr-row"><span class="nr-status-label nr-dense mac-caption"><span class="nr-status-label__dot nr-status-label__dot--critical"></span><span class="nr-status-label__text">Check failed</span></span><span class="nr-status-label nr-dense mac-caption"><span class="nr-status-label__dot nr-status-label__dot--positive"></span><span class="nr-status-label__text">Verified</span></span></div>
    </div>
  </section>
</div>
</body>
</html>
