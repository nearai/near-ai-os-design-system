<!-- @dsCard group="Navigation" height=300 subtitle="The Ember Rule: Home, Private AI, Traces, Insights" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tabs — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <section class="nr-pane nr-compact nr-stack" style="width: 440px" aria-label="Main pane, macOS">
    <div class="nr-tabs nr-tabs--bleed" style="--nr-tabs-count: 4; --nr-tabs-index: 0">
      <div class="nr-tabs__list" role="tablist" aria-label="Sections">
        <button class="nr-tabs__tab mac-body" role="tab" aria-selected="true">Home</button>
        <button class="nr-tabs__tab mac-body" role="tab" aria-selected="false" tabindex="-1">Private AI <span class="nr-tabs__dot nr-tabs__dot--positive" aria-hidden="true"></span><span class="nr-visually-hidden">, answering</span></button>
        <button class="nr-tabs__tab mac-body" role="tab" aria-selected="false" tabindex="-1">Traces <span class="nr-tabs__badge nr-tabs__badge--caution mac-micro" aria-hidden="true">3</span><span class="nr-visually-hidden">, 3 decisions owed</span></button>
        <button class="nr-tabs__tab mac-body" role="tab" aria-selected="false" tabindex="-1">Insights</button>
        <span class="nr-tabs__ember" aria-hidden="true"></span>
      </div>
    </div>
    <div class="nr-card nr-card--quiet nr-stack">
      <div class="mac-body-strong">Watching 3 folders</div>
      <div class="mac-caption nr-text-secondary">3 traces are waiting for a decision. Nothing is sent unless you say so.</div>
    </div>
  </section>

  <section class="nr-pane nr-stack" style="width: 264px" aria-label="Agents screen, touch">
    <div class="nr-touch">
      <div class="nr-tabs nr-tabs--bleed" style="--nr-tabs-count: 3; --nr-tabs-index: 1">
        <div class="nr-tabs__list" role="tablist" aria-label="Agent runs">
          <button class="nr-tabs__tab android-label" role="tab" aria-selected="false" tabindex="-1">Running</button>
          <button class="nr-tabs__tab android-label" role="tab" aria-selected="true">Waiting <span class="nr-tabs__badge nr-tabs__badge--alert android-micro" aria-hidden="true">2</span><span class="nr-visually-hidden">, 2 need your approval</span></button>
          <button class="nr-tabs__tab android-label" role="tab" aria-selected="false" tabindex="-1">Done</button>
          <span class="nr-tabs__ember" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <div class="web-caption nr-text-secondary">Touch: 48 tall, the alert badge for runs that wait on you.</div>
  </section>

  <section class="nr-pane nr-stack" style="width: 440px" aria-label="Main pane, web, movable tabs">
    <div class="nr-tabs nr-tabs--bleed nr-tabs--movable" style="--nr-tabs-count: 4; --nr-tabs-index: 2">
      <div class="nr-tabs__list" role="tablist" aria-label="Sections">
        <button class="nr-tabs__tab web-body" role="tab" aria-selected="false" tabindex="-1">Home</button>
        <button class="nr-tabs__tab web-body" role="tab" aria-selected="false" tabindex="-1">Private AI <span class="nr-tabs__dot nr-tabs__dot--positive" aria-hidden="true"></span><span class="nr-visually-hidden">, answering</span></button>
        <button class="nr-tabs__tab web-body" role="tab" aria-selected="true">Traces <span class="nr-tabs__badge web-micro" aria-hidden="true">&#8212;</span><span class="nr-visually-hidden">, decisions owed unknown</span></button>
        <button class="nr-tabs__tab nr-tabs__tab--lifted web-body" role="tab" aria-selected="false" tabindex="-1">Insights</button>
        <span class="nr-tabs__ember" aria-hidden="true"></span>
      </div>
    </div>
    <div class="web-caption nr-text-secondary">Web, Traces selected; its count is unknown, so the pill shows a dash. Insights is lifted by a held press, ready to drag; Home stays first.</div>
  </section>
</div>
<script>
document.querySelectorAll('.nr-tabs').forEach(function (bar) {
  var tabs = Array.prototype.slice.call(bar.querySelectorAll('[role="tab"]'));
  function select(i, focus) {
    tabs.forEach(function (t, j) { t.setAttribute('aria-selected', String(i === j)); t.tabIndex = i === j ? 0 : -1; });
    bar.style.setProperty('--nr-tabs-index', i);
    if (focus) tabs[i].focus();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { select(i, false); });
    t.addEventListener('keydown', function (e) {
      var n = tabs.length, k = { ArrowRight: i + 1, ArrowLeft: i - 1 + n, Home: 0, End: n - 1 }[e.key];
      if (k !== undefined) { e.preventDefault(); select(k % n, true); }
    });
  });
});
</script>
</body>
</html>
