<!-- @dsCard group="Feedback" height=190 subtitle="The undo bar: floating on web and phones, docked on the Mac" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div class="nr-preview nr-scene">
  <div class="nr-stack" style="width: 360px">
    <div class="nr-toast">
      <div class="nr-toast__text">
        <span class="nr-toast__title web-body-strong" role="status">Approved 1 trace</span>
        <span class="nr-toast__detail web-caption">Approved 12s ago</span>
      </div>
      <div class="nr-toast__actions">
        <button class="nr-button nr-button--glass web-label" aria-keyshortcuts="Control+Z">Undo</button>
        <button class="nr-button nr-button--link web-label">Dismiss</button>
      </div>
    </div>
    <div class="nr-toast">
      <div class="nr-toast__text">
        <span class="nr-toast__title web-label" role="status">near-agents now asks before anything is sent.</span>
      </div>
    </div>
  </div>
  <section class="nr-pane nr-compact" style="width: 352px">
    <div class="nr-toast nr-toast--docked">
      <div class="nr-toast__text">
        <span class="nr-toast__eyebrow mac-eyebrow">APPROVAL SAVED</span>
        <span class="nr-toast__title mac-body-strong" role="status">near-agents approved</span>
        <span class="nr-toast__detail mac-caption">Approved traces will send automatically. You can undo until uploading starts.</span>
        <span class="nr-toast__detail mac-caption">Approved 48s ago</span>
      </div>
      <div class="nr-toast__actions">
        <button class="nr-button nr-button--glass mac-label" aria-keyshortcuts="Enter">Undo</button>
        <button class="nr-button nr-button--link mac-label">Dismiss</button>
      </div>
    </div>
  </section>
</div>
</body>
</html>
